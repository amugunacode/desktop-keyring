<body>
  <main class="wrap">
    <header class="profile">
      <div class="avatar" aria-hidden="true">a</div>
      <h1>amuguna lab</h1>
      <p class="bio">직접 만든 작은 프로그램들<span class="en">Little things I made — pick one and try it</span></p>
    </header>

    <!--
      Program cards. To add a program, copy one <a class="card"> block,
      change the link, image, title, description and tags.
    -->
    <section class="cards" aria-label="프로그램 목록 · Programs">
      <a class="card" href="https://catpuzzle.vercel.app/">
        <img class="thumb" src="puzzle.jpg" width="1200" height="750" alt="사진 직소 퍼즐을 맞추는 화면">
        <div class="body">
          <h2>🧩 사진 직소 퍼즐<span class="en">Photo Jigsaw</span></h2>
          <p>내 사진을 올리면 바로 직소 퍼즐로. 맞추면 따봉 고양이가 반겨 주고, 친구에게 도전장도 보낼 수 있어요.</p>
          <ul class="tags" aria-label="특징">
            <li>웹에서 바로</li><li>설치 없음</li><li>무료</li><li>타임랩스 영상</li>
          </ul>
          <span class="cta">플레이하기 · Play <span aria-hidden="true">→</span></span>
        </div>
      </a>
    </section>

    <footer class="foot">
      <p>사진은 내 기기에서만 처리되고 업로드되지 않아요.<span class="en">Your photos stay on your device.</span></p>
    </footer>
